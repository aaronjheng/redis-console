version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    ignore:
      # Pinned to PR #81 commit (scanner.c fix). Remove after upstream releases a new tag.
      - dependency-name: tree-sitter-lua
    groups:
      swift:
        patterns:
          - "*"
